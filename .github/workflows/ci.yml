name: CI

on:
  # CI runs only at explicit checkpoints, not on every commit, PR, branch
  # push, or tag. Dispatch it manually when a coherent batch is ready for
  # validation so a series of small PRs costs one run instead of one each.
  #
  # Deliberately NOT on pull_request or push: a stacked series produced ~3
  # runs per PR, most cancelling each other before finishing.
  #
  # Local exact-head/base validation is the default review evidence. Hosted
  # execution is optional and must be explicitly requested; required repository
  # rules and blocking review feedback still apply to every merge.
  workflow_dispatch:
  # Release Candidate deliberately reuses these checks as one lane of its
  # explicitly initiated validation workflow. This is callable, not ambient.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install zsh for shell integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          zsh --version

      - name: Set up Node for CLI launcher tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Separate cold process; never disable DFG for the warm full-JIT matrix.
      - name: Cold no-DFG extension read-timeout witness
        # Diagnostic only: this witness requires the exact candidate Bun revision
        # and refuses at 1.4.4; let the rest of the chain run after it.
        continue-on-error: true
        env:
          BUN_JSC_useDFGJIT: "0"
        run: bun scripts/extension-numeric-spike/witness.ts credential none async read-timeout

      - name: Sync exec fence
        run: bun run sync-exec:fence

      - name: Public repository presentation
        run: bun run check:presentation

      - name: Typecheck
        # Share the package list with the root check command.
        run: bun run check:types

      - name: CLI launcher and package tests
        run: bun run test:cli

      # Keep runtime selection in its package script: nested units and scenarios,
      # excluding opt-in live tests. Both the root chain and fallback delegate.
      - name: Unit tests
        env:
          OPENSCOUT_CONFORMANCE: "1"
        # Diagnostic only: run each part of test:unit:source even after one
        # fails, so one run at 1.4.4 shows every suite; fail at the end.
        run: |
          status=0
          for part in \
            "bun run test:remote-target-programs" \
            "bun run --cwd packages/protocol test" \
            "bun run --cwd packages/agent-sessions test" \
            "bun run --cwd packages/runtime test" \
            "bun run --cwd packages/cli test:source" \
            "bun run --cwd apps/desktop test" \
            "bun run --cwd packages/web test" \
            "bun run --cwd packages/session-trace test" \
            "bun run --cwd packages/session-trace-react test" \
            "node --test scripts/ship-release.test.mjs scripts/bundle-scout-web.test.mjs scripts/check-packed-dependencies.test.mjs" \
            "bun run --cwd packages/mesh-extension test" \
            "bun run test:pairing-capsule"
          do
            code=0; bash -c "$part" || code=$?
            echo "PART RESULT: $code $part"
            [ "$code" = 0 ] || status=1
          done
          exit $status

  rust-scoutd:
    name: scoutd verification
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify portable voice core
        run: |
          cargo check --manifest-path crates/openscout-voice-core/Cargo.toml --all-features
          cargo test --manifest-path crates/openscout-voice-core/Cargo.toml --all-features

      - name: Verify scout-tui
        run: cargo check --manifest-path crates/scout-tui/Cargo.toml

      - name: Verify
        run: bash scripts/scoutd-verify.sh

  extension-channel-qualification:
    name: Dormant extension channel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.x"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # Independent of checks/scenarios; positive skips fail this checkpoint.
      - run: bun run test:extension-channel:qualification
