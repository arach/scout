# Diagnostic-only side branch; never merge this replacement into the product CI.
# Reuse the existing default-branch workflow identity so the operator can dispatch this ref.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Context target5 simplex, rejected mechanism
        id: context
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p descriptor-record
          bun scripts/extension-descriptor-record.ts context 2>&1 | tee descriptor-record/context.jsonl
      - name: Credential target6 duplex, rejected mechanism
        id: credential
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p descriptor-record
          bun scripts/extension-descriptor-record.ts credential 2>&1 | tee descriptor-record/credential.jsonl
      - name: Save the record even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-extra-pipe-ownership-record
          path: descriptor-record/
      - name: Record meaning
        if: always()
        env:
          CONTEXT_OUTCOME: ${{ steps.context.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
        run: |
          echo "Rejected extra-pipe mechanism; this run decides no qualification." >> "$GITHUB_STEP_SUMMARY"
          echo "Context: $CONTEXT_OUTCOME; credential: $CREDENTIAL_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          test "$CONTEXT_OUTCOME" = success && test "$CREDENTIAL_OUTCOME" = success
