name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bun-git-shape:
    name: Git sync-spawn old baseline then Bun 1.4.4
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Download checksum-pinned Bun binaries without installing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bun-probes"
          cd "$RUNNER_TEMP/bun-probes"
          for version in 1.3.14 1.4.4; do
            mkdir "$version"
            curl -fLsS --max-time 120 "https://github.com/oven-sh/bun/releases/download/bun-v$version/bun-linux-x64.zip" -o "$version/bun.zip"
          done
          echo '951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  1.3.14/bun.zip' | sha256sum -c -
          echo 'bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c  1.4.4/bun.zip' | sha256sum -c -
          unzip -q 1.3.14/bun.zip -d 1.3.14
          unzip -q 1.4.4/bun.zip -d 1.4.4
          chmod +x */bun-linux-x64/bun
      - name: Failing baseline first, then identical subject on 1.4.4
        shell: bash
        run: |
          set -euo pipefail
          python3 -I diagnostics/bun-git-shape/probe.py linux-old "$RUNNER_TEMP/bun-probes/1.3.14/bun-linux-x64/bun" "$GITHUB_WORKSPACE/diagnostics/bun-git-shape/git-shape.mjs"
          python3 -I diagnostics/bun-git-shape/probe.py linux-new "$RUNNER_TEMP/bun-probes/1.4.4/bun-linux-x64/bun" "$GITHUB_WORKSPACE/diagnostics/bun-git-shape/git-shape.mjs"
          python3 -I diagnostics/bun-git-shape/classify.py
      - name: Preserve both receipts and kernel snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-git-shape
          path: |
            diagnostics/bun-git-shape/linux-old/
            diagnostics/bun-git-shape/linux-new/
          if-no-files-found: warn
